# Shared guide setup (not a guide): the app open clean (dark or the app's default theme, dev panels hidden, through
# the demos' _open.yaml), signed in as the seeded user (member@app.test), on Home.
appId: ${APP_ID}
---
- runFlow: ../demos/_open.yaml
- runFlow:
    file: ../subflows/sign-in-as.yaml
    env:
      EMAIL_JSON: '%7B%22email%22%3A%22member%40app.test%22%7D'
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
