# Shared demo setup: open this slot's bundle in the dev client with the dev tools button hidden, and set the
# theme (the app's default; `pnpm demo <name> --light|--dark` passes THEME). Demo setup flows start with
# `- runFlow: ../_open.yaml`.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- openLink: exp+${SCHEME}://?__expo_url=http%3A%2F%2F127.0.0.1%3A${METRO_PORT}&__expo_disable_onboarding=1&__expo_disable_fab=1
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 60000
    optional: true
- openLink: ${SCHEME}://__agent/theme?payload=%7B%22theme%22%3A%22${THEME}%22%7D
- tapOn:
    text: Open
    optional: true
# Demo recordings hide the dev-only panels (seeded accounts on sign-in, the harness card on Home).
- openLink: ${SCHEME}://__agent/demo
- tapOn:
    text: Open
    optional: true
