name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: integration (Supabase + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_EXPERIMENTAL_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (stack mode) and write .env.local
        run: pnpm sb start
      - name: Every seed scenario applies
        run: |
          for s in $(ls supabase/seeds/scenarios | sed 's/\.sql$//'); do pnpm -s seed "$s"; done
      - name: Reset to the base seed
        run: supabase db reset --local --yes
      - name: pgTAP
        run: pnpm test:db
      - name: Vitest against the local API
        run: pnpm test:integration
      - name: Stop
        if: always()
        run: supabase stack stop || true
